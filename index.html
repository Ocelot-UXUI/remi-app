<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>Remi - AI记忆助手</title>
  <script src="./vendor/react.min.js"></script>
  <script src="./vendor/react-dom.min.js"></script>
  <script src="./vendor/babel.min.js"></script>
  <script src="./vendor/tailwind.js"></script>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.getElementById('root').innerHTML =
        '<div style="padding:20px;color:red;font-family:monospace;white-space:pre-wrap">' +
        '<b>JS 报错</b><br>' + msg + '<br>行:' + line + ' 列:' + col +
        (err ? '<br>' + err.stack : '') + '</div>';
      return false;
    };
  </script>
  <style>
    /* ====== tailwindcss-animate 兼容动画系统 ====== */
    .animate-in {
      --enter-opacity: 1;
      --enter-scale: 1;
      --enter-translate-x: 0;
      --enter-translate-y: 0;
      --anim-dur: 150ms;
      animation: tw-enter var(--anim-dur) cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes tw-enter {
      from {
        opacity: var(--enter-opacity);
        transform: translate3d(var(--enter-translate-x), var(--enter-translate-y), 0)
                   scale3d(var(--enter-scale), var(--enter-scale), 1);
      }
    }
    .fade-in               { --enter-opacity: 0; }
    .zoom-in-95            { --enter-scale: 0.95; }
    .slide-in-from-bottom-4 { --enter-translate-y: 1rem; }
    .slide-in-from-right-4  { --enter-translate-x: 1rem; }
    .slide-in-from-top-2    { --enter-translate-y: -0.5rem; }
    .duration-200 { --anim-dur: 200ms; }
    .duration-300 { --anim-dur: 300ms; }
    .duration-400 { --anim-dur: 400ms; }

    /* ====== Line-clamp ====== */
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* ====== 全局 Scrollbar 隐藏 ====== */
    .no-scrollbar::-webkit-scrollbar, .hide-scrollbar::-webkit-scrollbar { display: none; }

    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #root { height: 100vh; width: 100vw; overflow: hidden; }
    * { box-sizing: border-box; }

/* 本次仅细化金句、待办两类卡片，沿用原有布局和颜色分类。 */
.refined-card{border:1px solid var(--edge);border-radius:16px;overflow:hidden;background:linear-gradient(145deg,var(--tint),#fff 78%);box-shadow:0 2px 5px #22203304;transition:box-shadow .2s,border-color .2s;min-width:0}
.refined-card:hover{box-shadow:0 6px 18px #29213709;border-color:var(--accent)}
.refined-inner{padding:21px 21px 18px}.refined-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.refined-type{font-size:11px;line-height:18px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--badge);border-radius:6px;padding:3px 8px}.refined-count{font-size:10px;color:#9b9da6}
.refined-quote{font-size:20px;line-height:1.85;font-weight:600;letter-spacing:.1px;color:#34323e;margin:23px 0 15px;position:relative;padding-left:14px;border-left:3px solid #e9dba7}
.refined-quote mark{background:linear-gradient(transparent 62%,#fcf0bd 62%);color:inherit;padding-bottom:2px}.refined-context{font-size:11px;line-height:1.8;color:#97929a;margin:0 0 21px}.refined-source{display:flex;align-items:center;gap:6px;font-size:10px;color:#9a93aa;min-width:0}.refined-source button{background:none;border:0;padding:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8e819f;cursor:pointer}.refined-source button:hover{color:#7f56d9}.refined-source button:focus-visible,.refined-action:focus-visible,.refined-task input:focus-visible{outline:2px solid #9f83cd;outline-offset:3px}.refined-foot{border-top:1px solid var(--edge);padding:13px 20px;background:#ffffff75;display:flex;align-items:center;gap:12px}.refined-action{border:0;background:none;font-size:11px;color:#665a7e;text-align:left;padding:0;line-height:1.6;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:1}.refined-action:hover{color:#7f56d9}.refined-more{color:#a5a1ab;font-size:10px;cursor:pointer;white-space:nowrap}.refined-more summary{list-style:none}.refined-more summary:hover{color:#7f56d9}.refined-more button{border:0;background:none;color:#7f56d9;text-align:left;font-size:10px;margin-top:8px;padding:0;max-width:105px}.refined-title{font-size:16px;line-height:1.65;font-weight:650;color:#30383a;margin:18px 0 5px}.refined-sub{font-size:11px;line-height:1.7;color:#929b97;margin:0 0 16px}.refined-task{display:flex;align-items:flex-start;gap:10px;border-top:1px solid #e6efe8;padding:15px 0;cursor:pointer}.refined-task input{appearance:none;width:16px;height:16px;margin-top:3px;border:1.3px solid #afc7b7;border-radius:4px;background:white;flex-shrink:0;display:grid;place-items:center;cursor:pointer}.refined-task input:checked{background:#75a98a;border-color:#75a98a}.refined-task input:checked:after{content:'✓';color:white;font-size:11px}.refined-task-name{font-size:13px;color:#38443d;line-height:1.7;font-weight:500}.refined-task:has(input:checked) .refined-task-name{text-decoration:line-through;color:#a0ada4}.refined-task-meta{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:10px;color:#97a49c}.refined-due{color:#72917d;background:#e9f3ec;padding:1px 6px;border-radius:4px}.refined-task:has(input:checked) .refined-task-meta{opacity:.5}.refined-evidence{font-size:11px;line-height:1.9;color:#8d839b;padding:10px 0 0}.refined-evidence summary{cursor:pointer;color:#8f819f;font-size:10px}
.refined-body{font-size:13px;line-height:1.95;color:#686575;margin:16px 0 22px}
.simple-heading .simple-kind{color:#807a89;opacity:1;padding-top:3px;display:flex;align-items:center;justify-content:center;width:22px;height:24px}.remi-category-icon{display:block;overflow:visible}
.refined-points{list-style:none;padding:0;margin:17px 0 20px;display:grid;gap:13px}.refined-points li{display:flex;align-items:flex-start;gap:9px;font-size:15px;color:#66616f;line-height:1.85}.refined-points li:before{content:'';width:4px;height:4px;border-radius:50%;background:#b59ad7;flex:none;margin-top:10px}
.refined-insight{font-size:14px;font-weight:500;line-height:1.9;color:#46586b;margin:17px 0 20px;padding-left:12px;border-left:2px solid #b9dbee}
.refined-sources{display:flex;flex-direction:column;gap:7px;margin:19px 0 4px;padding-top:13px;border-top:1px solid var(--edge)}.refined-sources .refined-source button{color:#86909d}
.refined-excerpt{font-size:14px;line-height:1.95;color:#67545d;margin:19px 0 15px;border-left:2px solid #ebbdc8;padding:2px 0 2px 12px}.refined-excerpt mark{color:inherit;background:#fce0e6;border-bottom:1px dashed #dc9baa;padding-bottom:2px}.refined-risk-note{font-size:11px;line-height:1.8;color:#a0808a;margin-bottom:20px}
.refined-stack{display:flex;align-items:center;gap:8px;margin-top:18px;color:#a19bb2;font-size:11px}.refined-stack-icons{display:flex;padding-right:6px}.refined-stack-icons span{width:27px;height:31px;border:1px solid #ddd6ed;border-radius:5px;background:#faf8ff;display:grid;place-items:center;margin-right:-6px;box-shadow:0 1px 2px #53446d06}.refined-stack-icons span:nth-child(2){transform:rotate(5deg)}.refined-aggregation-title{font-size:17px;line-height:1.65;font-weight:600;margin:18px 0 9px;color:#443c5b}.refined-report-description{font-size:12px;line-height:1.9;color:#827b90;margin:0 0 18px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.refined-report-types{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}.refined-report-types span{font-size:10px;padding:3px 7px;border-radius:4px;background:#efebf6;color:#9a8dad}
/* 标题优先，每张卡默认仅呈现核心内容与一个操作。 */
.simple-heading{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}.simple-heading h4{font-size:17px;line-height:1.65;font-weight:650;color:#383541;margin:0;flex:1}.simple-kind{flex:none;color:var(--accent);padding-top:5px;opacity:.8}.simplified-card .refined-inner{padding:21px 21px 18px}.simplified-card .refined-quote{margin:18px 0 2px;font-size:19px;line-height:1.85}.simplified-card .refined-body{margin:15px 0 1px}.simplified-card .refined-insight{margin:16px 0 2px;font-size:15px;font-weight:400}.simplified-card .refined-excerpt{margin:16px 0 2px;font-size:15px}.simplified-card .refined-points{margin:16px 0 2px;gap:10px}.simple-tasks{margin-top:15px}.simple-tasks .refined-task:last-child{padding-bottom:0}.simple-task-meta{font-size:13px;color:#9aa59e;margin-top:5px;line-height:1.6}.refined-task:has(input:checked) .simple-task-meta{opacity:.5;font-size:13px;}.simple-details{position:relative;flex:none}.simple-details summary{cursor:pointer;color:#a6a0ad;list-style:none;letter-spacing:2px;font-size:15px;padding:0 2px}.simple-details summary::-webkit-details-marker{display:none}.simple-details summary:focus-visible{outline:2px solid #9f83cd;outline-offset:3px}.simple-details-panel{font-size:11px;line-height:1.8;color:#92889e;padding-top:12px;display:grid;gap:9px}.simple-details[open]{width:100%;border-top:1px solid var(--edge);padding-top:10px}.simple-details[open] summary{font-size:10px;letter-spacing:0}.simple-details[open] summary:after{content:' 收起详情'}.simplified-card .refined-foot:has(.simple-details[open]){flex-wrap:wrap}.simple-detail-label{font-size:10px;color:var(--accent)}.simple-detail-source,.simple-detail-action{background:none;border:0;text-align:left;padding:0;font:inherit;color:#8b7a9f;cursor:pointer;display:flex;align-items:center;gap:6px;line-height:1.8}.simple-detail-source svg{flex:none}.simple-details-panel p{margin:0;color:#a095a9}

/* 统一标题层级；类型只承担辅助识别。 */
.simple-title-block{min-width:0;flex:1}.simple-category-label{display:block;font-size:13px;line-height:1.6;color:#918998;margin-top:5px;font-weight:400;letter-spacing:.2px}
.simple-heading .simple-kind{color:var(--accent)}
.report-contents{list-style:none;margin:16px 0 2px;padding:0;display:grid;gap:0}.report-contents li{display:flex;align-items:baseline;gap:12px;padding:10px 0;font-size:15px;line-height:1.7;color:#655c76;border-top:1px solid var(--edge)}.report-number{font-size:10px;font-variant-numeric:tabular-nums;color:#a598b4;flex:none}

/* Type marks sit in the card surface, with color concentrated at the corner. */
.refined-card.simplified-card{position:relative;background:radial-gradient(ellipse 170px 120px at 100% 0%,var(--tint),transparent 95%),#fff;box-shadow:none}
.refined-card.simplified-card:hover{border-color:var(--edge);box-shadow:0 5px 18px #3d2c4b07}
.simplified-card .refined-inner{position:relative}
.simplified-card .simple-heading{display:block;position:static}
.simplified-card .simple-title-block{position:relative;z-index:1;padding-right:21px}
.simplified-card .simple-heading .simple-kind{position:absolute;right:10px;top:9px;width:50px;height:50px;padding:0;color:var(--accent);opacity:.19;pointer-events:none;z-index:0}
.simplified-card .simple-kind>svg{display:block;width:48px;height:48px;stroke-width:1.6}
.simplified-card .simple-category-label{color:#a69aaf;font-size:13px;}
.simplified-card .refined-quote,.simplified-card .refined-body,.simplified-card .refined-insight,.simplified-card .refined-excerpt,.simplified-card .refined-points,.simplified-card .simple-tasks,.simplified-card .report-contents{position:relative;z-index:1}

/* Keep a suggested question as one compact visual unit. */
.card-question-area .card-question-button{gap:7px;justify-content:flex-start;padding:9px 7px;font-size:14px;line-height:1.65}
.card-question-area .card-question-button>svg{width:13px;height:13px;stroke-width:1.7;opacity:.8}
.card-question-area .card-question-button>span{flex:0 1 auto}
.card-question-area .card-question-button:hover>span{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:#b9a7c7}

/* 侧栏统一尺寸，品牌区与菜单使用明确的布局类。 */

.remi-sidebar>div:last-child{border:0!important;padding:16px!important}.remi-sidebar>div:last-child>div{border:0!important;padding:9px 6px!important;background:transparent}

.board-section-heading>button{background:#202124!important;border-color:#202124!important;color:#fff!important;border-radius:20px!important}

.remi-home-welcome{text-align:center;padding:23px 12px 31px}.remi-home-welcome h1{margin:0 0 13px;font-size:28px;line-height:1.5;letter-spacing:-.5px;font-weight:600;color:#202124}.remi-home-welcome p{margin:0;font-size:13px;line-height:1.9;color:#85888d}
@media(max-width:900px){.remi-home-welcome{padding:12px 4px 24px}.remi-home-welcome h1{font-size:23px}.remi-home-welcome p{font-size:12px}}
/* 顶栏光感：低对比点阵与缓慢流动的冷色光晕。 */
.remi-status{position:relative;isolation:isolate;overflow:hidden;background:#fcfdff!important;border:0!important;box-shadow:inset 0 0 0 1px #e6eaf080!important;min-height:60px;height:60px!important}
.remi-status::before{content:none;position:absolute;inset:-55px -12%;z-index:0;pointer-events:none;background:radial-gradient(ellipse 170px 66px at 28% 55%,#c7baf06b,transparent 80%),radial-gradient(ellipse 145px 62px at 53% 40%,#d8cff260,transparent 80%),radial-gradient(ellipse 90px 46px at 69% 60%,#bfb7e85c,transparent 85%);animation:none;will-change:transform}
.remi-status::after{content:none;position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,#9178b34a 1.05px,transparent 1.3px);background-size:14px 14px;mask-image:linear-gradient(90deg,transparent 8%,#000 43%,#000 65%,transparent 88%);opacity:.7; animation:none;}
.remi-status>div{position:relative;z-index:1}
.remi-status>div:first-child>svg{color:#7560bb!important;filter:drop-shadow(0 0 5px #c8bbec66);animation:remi-icon-breathe 5s ease-in-out infinite;transform-origin:center}
.remi-status>div:first-child{color:#687183!important}
.remi-status>div:last-child>button{transition:background .2s ease,box-shadow .2s ease;box-shadow:none!important}
.remi-status>div:last-child>button:last-child{background:#ffffffb8!important;border-color:#e6e9ef!important;color:#424957!important}
.remi-status>div:last-child>button:hover{background:#fff!important;box-shadow:0 2px 7px #353f5810!important}
@keyframes remi-ambient-flow{0%{transform:translateX(-5%) scale(1);opacity:.65}100%{transform:translateX(8%) scale(1.08);opacity:1}}
@keyframes remi-icon-breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}

.remi-topics-content{position:relative; padding:38px 40px 56px;max-width:1160px;}

/* 统一品牌紫：主操作、选中状态和图标共享同一色阶。 */

.remi-app-theme [class~="text-purple-500"],.remi-app-theme [class~="text-purple-600"],.remi-app-theme [class~="text-purple-700"]{color:var(--remi-purple-text)!important}

/* 封面式专题列表：首位新建，信息置于封面下方。 */
.topic-gallery{gap:24px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.topic-gallery-item{display:flex;flex-direction:column;align-items:stretch;min-width:0;background:none;border:0;padding:0;text-align:left;font-family:inherit;cursor:pointer;border-radius:12px}
.topic-cover{display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;border-radius:11px;background:#eeedf0;overflow:hidden;transition:filter .18s,background .18s}
.topic-cover img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.topic-gallery-item:hover .topic-cover img{transform:scale(1.025)}

.topic-gallery-title{display:block;margin:12px 12px 0;font-size:14px;line-height:1.65;font-weight:500;color:var(--remi-ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.topic-gallery-item:focus-visible{outline:2px solid #9a87c2;outline-offset:5px}
@media(max-width:650px){.topic-gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.topic-gallery-title{margin:9px 5px 0;font-size:14px; color:var(--remi-ink);}.topic-gallery-date{margin-left:5px; font-size:12px;color:var(--remi-secondary);}}
@media(prefers-reduced-motion:reduce){.topic-cover img{transition:none}.topic-gallery-item:hover .topic-cover img{transform:none}}

/* 封面卡 hover：完整灰底包住封面、名称与日期。 */
.topic-gallery-item{padding:7px 7px 14px;border-radius:17px;transition:background .18s}

.topic-gallery-existing:hover,.topic-gallery-existing:focus-within{background:#ececee}
.topic-gallery-open{display:flex;flex-direction:column;align-items:stretch;width:100%;min-width:0;background:none;border:0;padding:0;text-align:left;font-family:inherit;cursor:pointer;border-radius:11px}
.topic-gallery-existing .topic-cover{border-radius:11px}
.topic-gallery-item:hover .topic-cover img{transform:none}
.topic-gallery-existing .topic-gallery-title{margin-top:13px;margin-left:11px;margin-right:11px; font-size:14px;color:var(--remi-ink);}
.topic-gallery-existing .topic-gallery-date{margin-left:11px;margin-right:11px;color:var(--remi-secondary); font-size:12px;}

.topic-gallery-open:focus-visible{outline:2px solid #9483b7;outline-offset:3px}

.remi-status>div:first-child>svg.remi-memory-mark{color:#81778f!important;filter:none;animation:none}

.recent-resource-icon.recording,.recent-resource-icon.conversation{background:transparent;color:#8b8592}
.recent-resource:not(.is-only) .recent-resource-topic{margin-left:48px}
/* 拖拽：从轻微浮起，到聚拢光晕，再到接收确认。 */
.remi-toolbar{position:relative}
.remi-drop-zone{--drop-x:50%;position:relative;isolation:isolate;display:flex;align-items:center;gap:14px;height:60px;padding:0 22px;background:#faf8ff;border-radius:18px;box-shadow:0 4px 20px #7056c512;transform:translateY(-2px);animation:drop-lift .22s ease-out;transition:background .2s,box-shadow .2s,transform .2s}
.remi-drop-zone::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(105deg,#d7ceec,#a58cda,#e4dcf7,#bca9e1);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none}
.remi-drop-zone::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(ellipse 180px 70px at var(--drop-x) 50%,#ad94e445,transparent);opacity:.4;transition:opacity .2s;pointer-events:none}
.remi-drop-zone>*{pointer-events:none}

.drop-orbit>span{position:absolute;inset:-5px;border-radius:50%;border:1px solid #bba6dd66;opacity:.5}
.drop-copy{display:flex;flex-direction:column;gap:3px;min-width:0}.drop-copy strong{font-size:13px;line-height:1.5;font-weight:550;color:#796197}.drop-copy>span{font-size:10px;line-height:1.5;color:#aa9bbb}

.drop-target-dot{width:5px;height:5px;border-radius:50%;background:#b39dcc;flex:none;transition:background .2s,box-shadow .2s}
.remi-drop-zone.is-over{background:#f4effd;box-shadow:0 5px 24px #7056c525,0 0 0 4px #b9a2df0d;transform:translateY(-2px) scale(1.006)}
.remi-drop-zone.is-over::after{opacity:1}.remi-drop-zone.is-over::before{background:linear-gradient(105deg,#cab7eb,#8f70c4,#e4d9f6,#aa8bd7);background-size:220% 100%;animation:drop-edge-flow 3s linear infinite}
.remi-drop-zone.is-over .drop-copy strong{color:#664599}.remi-drop-zone.is-over .drop-orbit{background:#8a68bd;color:#fff;transform:scale(1.05)}.remi-drop-zone.is-over .drop-orbit>span{animation:drop-ring 1.8s ease-out infinite}.remi-drop-zone.is-over .drop-target-dot{background:#9271c3;box-shadow:0 0 8px #a184d2}
.recent-resource.is-dragging{opacity:.4;background:#ece8f3;transition:opacity .15s}
.drop-receipt{position:absolute;right:12px;bottom:-23px;min-height:18px;pointer-events:none}
.drop-receipt>span{display:flex;align-items:center;gap:6px;color:#86739e;font-size:10px;line-height:18px;animation:drop-receive .3s ease-out}.drop-receipt b{max-width:190px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400}
@keyframes drop-lift{from{opacity:.7}to{opacity:1}}
@keyframes drop-edge-flow{to{background-position:220% 0}}
@keyframes drop-ring{from{transform:scale(.9);opacity:.7}to{transform:scale(1.18);opacity:0}}
@keyframes drop-receive{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){.remi-drop-zone{padding:0 16px;gap:10px}.drop-file-name{display:none}.drop-target-dot{margin-left:auto}.drop-copy>span{font-size:9px}}
@media(prefers-reduced-motion:reduce){.remi-drop-zone,.remi-drop-zone.is-over{animation:none;transform:none;transition:none}.remi-drop-zone.is-over::before,.remi-drop-zone.is-over .drop-orbit>span,.drop-receipt>span{animation:none}}
/* 资料加入后：流动彩边与轻量文字操作。 */
.remi-composer-frame{position:relative;isolation:isolate;display:flex;align-items:center;gap:16px;min-height:60px;padding:9px 10px 9px 16px;background:#fff;border-radius:18px;box-shadow:0 3px 14px #6a52820a}
.remi-composer-frame::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;z-index:-1;background:linear-gradient(110deg,#a58acb,#c7b0de,#94bfc9,#b2a6df,#d4b0c6,#a58acb);background-size:300% 100%;animation:composer-edge-drift 8s linear infinite;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none;opacity:.75;transition:opacity .2s}
.remi-composer-frame:focus-within::before{opacity:1}

.composer-file>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.composer-file button{flex:none;display:grid;place-items:center;width:16px;height:16px;border:0;border-radius:3px;padding:0;background:none;color:#a19aa8;cursor:pointer}.composer-file button:hover{background:#e6e2ed;color:#655475}
.remi-composer-inputs>input{flex:1;min-width:160px;font:400 13px/1.6 -apple-system,"PingFang SC",sans-serif;color:#5b5266;border:0;padding:3px 0;outline:none;background:transparent}.remi-composer-inputs>input::placeholder{color:#aaa2b2}
.composer-submit{display:flex;align-items:center;justify-content:center;gap:7px;flex:none;border:0;border-radius:11px;padding:9px 15px;background:#7056c5;color:#fff;font:500 12px/1.5 -apple-system,"PingFang SC",sans-serif;cursor:pointer;transition:background .18s}.composer-submit:hover{background:#6046b1}

.composer-shortcuts>button{border:0;background:transparent;padding:5px 7px;color:#b0a7b9;font:400 10px/1.6 -apple-system,"PingFang SC",sans-serif;cursor:pointer}.composer-shortcuts>button:hover{color:#7f6c95}
.composer-submit:focus-visible,.composer-file button:focus-visible,.composer-options button:focus-visible{outline:2px solid #ac98cb;outline-offset:2px}

@media(max-width:700px){.remi-composer-frame{gap:10px;padding:9px 10px}.composer-files{max-width:100%}.remi-composer-inputs{gap:6px}.composer-submit{padding:9px 12px}.composer-options{padding-top:8px}.composer-shortcuts{margin-left:auto}}

/* 分析方向是可多选的分段控件，选中态有明确的底块。 */
.composer-options{padding:10px 2px 0;gap:12px}
.composer-modes{display:inline-flex;align-items:stretch;gap:3px;padding:3px;background:#eae8ef;border-radius:10px}

.floating-card-chat{position:fixed;z-index:90;width:400px;max-width:calc(100vw - 24px);height:550px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff;border:1px solid #e7e2ec;border-radius:18px;padding:0 20px 16px;box-shadow:0 16px 60px -12px #30213b26,0 3px 12px #30213b08;animation:card-window-appear .18s ease-out;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.floating-card-chat .card-chat-heading{height:58px;min-height:58px;gap:12px;margin:0 -2px 14px;border-bottom:1px solid #f0edf3;justify-content:space-between}
.floating-card-chat .card-chat-heading .floating-chat-context{display:flex;align-items:center;justify-content:flex-start;gap:9px;width:auto;min-width:0;height:36px;padding:0;background:transparent;color:#514859;font-size:13px;font-weight:550;text-align:left}
.floating-chat-context span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.floating-chat-context svg{flex-shrink:0;color:#9a87ad}
.floating-card-chat .card-chat-heading>button:last-child{flex-shrink:0;width:28px;height:28px;display:grid;place-items:center}
.floating-card-chat .card-chat-messages{flex:1;min-height:0;max-height:none;overflow-y:auto;padding:0 3px 8px;scrollbar-width:thin;scrollbar-color:#e5dfeb transparent}
.floating-card-chat .card-chat-message,.floating-card-chat .card-chat-message.user p,.floating-card-chat .card-answer-section h5{font-size:13px}
.floating-card-chat .card-chat-input{flex-shrink:0;margin-top:12px;background:#fff}
.floating-card-chat .card-chat-input textarea{font-size:13px}
.floating-card-chat .card-chat-message.user{margin-bottom:24px}
@keyframes card-window-appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.floating-card-chat{animation:none}}

/* Reply metadata and a quiet, functional action row. */
.reply-run-details{margin:0 0 18px;border-bottom:1px solid #efedf1;padding-bottom:10px;color:#a29ba7;font-size:11px}
.reply-run-details summary{list-style:none;display:flex;align-items:center;gap:5px;cursor:pointer;width:fit-content}
.reply-run-details summary::-webkit-details-marker{display:none}
.reply-run-details summary svg{transition:transform .15s}
.reply-run-details[open] summary svg{transform:rotate(90deg)}
.reply-run-details>div{padding:12px 0 0;font-size:11px;line-height:1.7}
.reply-run-details>div>span{color:#746c7c}
.reply-run-details p{margin:2px 0 8px;color:#7c7384}
.floating-card-chat .card-answer-tools{gap:6px;margin-top:16px;position:relative}
.floating-card-chat .card-answer-tools button{width:26px;height:27px;color:#aaa3af;border-radius:5px}
.floating-card-chat .card-answer-tools button:hover{color:#756381;background:#f6f3f8}
.floating-card-chat .card-answer-tools button[aria-pressed="true"]{color:#84659d;background:#f2edf6}
.floating-card-chat .card-answer-tools button:disabled{opacity:.35;cursor:default}
.reply-more-wrap{position:relative}
.reply-more-menu{position:absolute;bottom:34px;left:0;z-index:2;width:146px;padding:5px;border:1px solid #eae5ee;border-radius:9px;background:white;box-shadow:0 5px 20px #35263f14}
.floating-card-chat .card-answer-tools .reply-more-menu button{width:100%;height:31px;display:block;padding:0 8px;font-size:11px;text-align:left;color:#74697e}

/* Chat occupies its own viewport column. Board and messages scroll independently. */
.remi-workspace.has-chat-sidebar{padding-right:380px;min-width:0}
.remi-workspace.has-chat-sidebar .workspace-scroll{padding:24px 20px}
.remi-workspace.has-chat-sidebar .inspiration-section{padding:22px 18px}
.docked-card-chat.floating-card-chat{top:0;right:0;left:auto;bottom:0;width:380px;max-width:100vw;height:100vh;max-height:none;border-radius:0;border:0;border-left:1px solid #e9e5ee;box-shadow:none;padding:0 22px 20px;animation:none}
.docked-card-chat .card-chat-heading{height:65px;min-height:65px;margin-bottom:20px}
.sidebar-chat-brand{font-size:16px;font-weight:650;color:#302936}
.docked-card-chat .card-chat-messages{background:#fff}
.sidebar-chat-reference{margin-top:16px;display:flex;align-items:center;gap:8px;border:1px solid #ece7f0;border-radius:9px;padding:8px 10px;background:#faf9fc}
.sidebar-chat-reference button{display:flex;align-items:center;gap:7px;min-width:0;background:none;border:0;color:#71617e;font-size:11px;cursor:pointer}
.sidebar-chat-reference button:first-child{flex:1;text-align:left}
.sidebar-chat-reference button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-chat-reference svg{flex-shrink:0}
.sidebar-chat-empty{height:100%;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#b2a7bd;font-size:13px}
.docked-card-chat .card-chat-input{margin-top:10px;min-height:76px;align-items:flex-end}
.docked-card-chat .card-chat-input textarea{min-height:44px}
@media(max-width:1050px){.remi-workspace.has-chat-sidebar{padding-right:330px}.docked-card-chat.floating-card-chat{width:330px;padding-left:18px;padding-right:18px}}
@media(max-width:720px){.remi-workspace.has-chat-sidebar{padding-right:300px}.docked-card-chat.floating-card-chat{width:300px}.has-chat-sidebar .workspace-scroll{min-width:260px}}

/* The conversation is a column of the inspiration board itself. */
.board-conversation-layout{display:grid;grid-template-columns:minmax(0,1fr);align-items:start;gap:0;min-width:0}
.board-conversation-layout.is-chatting{grid-template-columns:minmax(0,1fr) minmax(290px,36%);gap:24px}
.sidebar-aware-grid{min-width:0}
.board-contained-chat.docked-card-chat.floating-card-chat{position:sticky;top:16px;left:auto;right:auto;bottom:auto;width:100%;max-width:none;height:min(640px,calc(100vh - 32px));max-height:calc(100vh - 32px);min-height:320px;border:0;border-left:1px solid #eeeaf2;border-radius:0;padding:0 0 0 22px;box-shadow:none;background:#fff;z-index:2;align-self:start}
.board-contained-chat.docked-card-chat .card-chat-heading{height:40px;min-height:40px;margin:0 0 18px;border-bottom:0}
.board-contained-chat .sidebar-chat-brand{font-size:14px;font-weight:600}
.board-contained-chat .card-chat-input{margin-bottom:0}
.board-contained-chat .card-chat-messages{overscroll-behavior-y:contain}
@media(max-width:950px){.board-conversation-layout.is-chatting{grid-template-columns:minmax(220px,1fr) minmax(270px,43%);gap:18px}.board-contained-chat.docked-card-chat.floating-card-chat{padding-left:16px}}
@media(max-width:650px){.board-conversation-layout.is-chatting{grid-template-columns:minmax(0,1fr)}.board-contained-chat.docked-card-chat.floating-card-chat{position:relative;top:auto;border-left:0;border-top:1px solid #eeeaf2;padding:18px 0 0}}

/* A complete compact chatbot, with its own frame and composer. */
.board-conversation-layout.is-chatting{grid-template-columns:minmax(0,1fr) minmax(340px,42%);gap:22px}
.board-contained-chat.docked-card-chat.floating-card-chat{border:1px solid #e7e5ea;border-radius:16px;padding:0;overflow:hidden;height:min(680px,calc(100vh - 32px));background:#fff;box-shadow:0 3px 16px #30213b06}
.board-contained-chat.docked-card-chat .card-chat-heading{height:58px;min-height:58px;padding:0 18px;margin:0;border-bottom:1px solid #f0eef2;background:#fff}
.board-contained-chat .sidebar-chat-brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#302c35}
.chatbot-header-mark{width:20px;height:25px;display:flex;align-items:center}
.chatbot-header-mark svg{display:block;width:20px;height:25px}
.board-contained-chat.docked-card-chat .card-chat-messages{padding:22px 20px 12px;scrollbar-gutter:stable;color:#37343b}
.board-contained-chat .card-chat-message,.board-contained-chat .card-chat-message.user p,.board-contained-chat .card-answer-section h5{font-size:14px;line-height:1.85;color:#45404b}
.board-contained-chat .card-chat-message.user{margin-bottom:28px}
.board-contained-chat .card-chat-message.user>p{background:#f1f0f3;color:#443e4b;padding:10px 14px;border-radius:16px;max-width:88%;line-height:1.7}
.board-contained-chat .card-answer-content strong{color:#342e3b}
.board-contained-chat .card-answer-identity{font-size:12px;margin-bottom:13px;color:#62556f}
.board-contained-chat .reply-run-details{font-size:11px;border:0;margin-bottom:13px;padding-bottom:0;color:#a39ba8}
.board-contained-chat .card-answer-section{margin-bottom:20px}
.board-contained-chat .card-answer-tools{gap:5px;margin-top:14px}
.chatbot-composer-dock{flex:none;margin:12px 14px 14px;border:1px solid #e6e2ea;border-radius:15px;background:#fff;box-shadow:0 2px 8px #30213b05;padding:10px;transition:border-color .15s}
.chatbot-composer-dock:focus-within{border-color:#bfb0cd}
.board-contained-chat .sidebar-chat-reference{margin:0 0 5px;padding:7px 9px;border:0;border-radius:7px;background:#f5f3f8}
.board-contained-chat .card-chat-input{display:flex;align-items:flex-end;gap:9px;min-height:64px;margin:0;padding:5px 1px 0;border:0;box-shadow:none;border-radius:0;background:transparent}
.board-contained-chat .card-chat-input textarea{align-self:stretch;width:100%;min-height:50px;padding:3px 0;font-size:13px;line-height:1.7;color:#48404f}
.board-contained-chat .card-chat-input>button{height:30px;width:30px;flex-shrink:0;background:#65536f;color:white}
.board-contained-chat .card-chat-input>button:disabled{background:#eeeaf2;color:#c2b8cc;opacity:1}
.board-contained-chat .sidebar-chat-empty{color:#8e819b;font-size:14px;gap:16px}
@media(max-width:950px){.board-conversation-layout.is-chatting{grid-template-columns:minmax(220px,1fr) minmax(320px,46%);gap:18px}.board-contained-chat.docked-card-chat.floating-card-chat{padding:0}}
@media(max-width:650px){.board-conversation-layout.is-chatting{grid-template-columns:minmax(0,1fr)}.board-contained-chat.docked-card-chat.floating-card-chat{padding:0}}

/* A citation belongs to the user message that carries it. */
.board-contained-chat .card-chat-message.user{flex-direction:column;align-items:flex-end;gap:9px}
.board-contained-chat .chat-message-reference{display:flex;flex-direction:column;gap:7px;width:260px;max-width:88%;padding:11px 12px;background:#fff;border:1px solid #e8e4ec;border-radius:11px;text-align:left;cursor:pointer;color:#84768f;transition:border-color .15s,background .15s}
.board-contained-chat .chat-message-reference:hover{border-color:#cdbed9;background:#fcfbfd}
.chat-reference-title{display:flex;align-items:center;gap:6px;width:100%;font-size:11px;line-height:1.6;font-weight:500}
.chat-reference-title>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-reference-title>svg{flex-shrink:0;color:#a699af}
.chat-reference-excerpt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.75;color:#68606f;padding-left:8px;border-left:2px solid #e5deed}
.chat-reference-source{font-size:10px;line-height:1.6;color:#b0a5b9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.chat-message-reference:focus-visible{outline:2px solid #b8a0ce;outline-offset:2px}

/* The citation carries the visual identity of its original insight card. */
.board-contained-chat .chat-message-reference{--ref-ink:#8c74ae;--ref-wash:#f5f0fc;--ref-edge:#e9e0f3;position:relative;isolation:isolate;overflow:hidden;gap:10px;width:268px;padding:15px 15px 11px;border:1px solid var(--ref-edge);border-radius:13px;background:radial-gradient(ellipse at 100% 0,var(--ref-wash),transparent 80%),#fff;box-shadow:0 3px 8px #35243d04;transition:transform .2s,border-color .2s,box-shadow .2s}
.board-contained-chat .chat-message-reference.reference-golden-quote{--ref-ink:#b69a50;--ref-wash:#fff8df;--ref-edge:#eee6cd}
.board-contained-chat .chat-message-reference.reference-todo{--ref-ink:#6b9b80;--ref-wash:#eaf8ef;--ref-edge:#dfece3}
.board-contained-chat .chat-message-reference.reference-main-thread{--ref-ink:#699fb8;--ref-wash:#eaf5fc;--ref-edge:#ddeaf2}
.board-contained-chat .chat-message-reference.reference-mine-clearance{--ref-ink:#bf8498;--ref-wash:#fcecf1;--ref-edge:#efdee5}
.board-contained-chat .chat-message-reference:hover{background:radial-gradient(ellipse at 100% 0,var(--ref-wash),transparent 80%),#fff;border-color:var(--ref-ink);transform:translateY(-2px);box-shadow:0 6px 14px #35243d0a}
.chat-reference-watermark{position:absolute;right:12px;top:4px;color:var(--ref-ink);opacity:.2;z-index:-1;font-family:Georgia,serif;font-weight:700;font-size:70px;line-height:1;pointer-events:none}
.chat-reference-watermark svg{margin-top:6px;stroke-width:1.6}
.chat-reference-title{padding-right:24px;color:#62586b;font-size:11px;font-weight:550}
.chat-reference-title>svg{position:absolute;right:12px;top:16px;opacity:0;transform:translateX(-3px);transition:opacity .2s,transform .2s}
.chat-message-reference:hover .chat-reference-title>svg{opacity:1;transform:none}
.chat-reference-excerpt{font-size:13px;line-height:1.85;color:#4d4654;padding:0;border-left:0;font-weight:500;-webkit-line-clamp:3}
.chat-reference-source{display:flex;align-items:center;gap:5px;width:100%;padding-top:9px;margin-top:1px;border-top:1px solid var(--ref-edge);font-size:9px;color:#aaa0b2}
.chat-reference-source svg{flex-shrink:0;color:var(--ref-ink);opacity:.65}
.chat-reference-source>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(prefers-reduced-motion:reduce){.board-contained-chat .chat-message-reference:hover{transform:none}}

.sidebar-chat-topic{display:flex;align-items:center;gap:8px;min-width:0;color:#514758;font-size:13px;font-weight:550}
.sidebar-chat-topic>svg{flex-shrink:0;color:#a08cae}
.sidebar-chat-topic>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-contained-chat .card-chat-heading>button{flex-shrink:0}

/* Shared content rails; prevent old component margins shifting the header. */
.board-contained-chat.docked-card-chat .card-chat-heading{margin:0;padding:0 20px;box-sizing:border-box;gap:12px}
.board-contained-chat.docked-card-chat .card-chat-messages{padding-left:20px;padding-right:20px;scrollbar-gutter:auto}
.board-contained-chat .card-answer-tools{margin-left:-5px;align-items:center}
.board-contained-chat .card-answer-tools button{padding:0;display:grid;place-items:center;line-height:1}
.board-contained-chat .card-answer-tools svg{display:block}
.board-contained-chat .chatbot-composer-dock{margin:12px;padding:8px;box-sizing:border-box}
.board-contained-chat .card-chat-input{padding:5px 0 0;align-items:flex-end}
.board-contained-chat .card-chat-input textarea{box-sizing:border-box;margin:0;display:block;padding:3px 0;min-height:50px}
.board-contained-chat .card-chat-input>button{margin:0;align-self:flex-end;padding:0}
.board-contained-chat .sidebar-chat-reference{box-sizing:border-box;gap:8px;padding:7px 8px;align-items:center}
.board-contained-chat .sidebar-chat-reference button{padding:0;line-height:1.6;align-items:center}
.card-question-area .card-question-button{border-radius:7px}
.card-question-area .card-question-button:focus:not(:focus-visible){outline:none}
.card-question-area .card-question-button:focus-visible{outline:1.5px solid #baa6ce;outline-offset:-1px}

/* Let the existing brand symbol stand on its own. */
.remi-sidebar .remi-brand>span{display:none}
.remi-sidebar .remi-brand>svg{width:28px;height:34px}
.remi-sidebar .remi-brand{gap:0}
.remi-sidebar .remi-brand .remi-collapse{margin-left:auto}
.remi-sidebar.is-collapsed .remi-brand .remi-collapse{margin-left:0}

/* Compact brand row and a usable icon rail when collapsed. */
.remi-sidebar .remi-brand{height:76px;padding:0 24px;flex-direction:row;align-items:center;justify-content:space-between;gap:0}
.remi-sidebar .remi-brand>svg{width:20px;height:24px}
.remi-sidebar .remi-brand .remi-collapse{width:28px;height:28px;padding:3px;flex-shrink:0;margin-left:auto;color:#8d8d92}
.remi-sidebar .remi-collapse>svg{display:block;width:22px;height:22px;stroke-width:1.7}
.remi-sidebar.is-collapsed{width:64px!important}
.remi-sidebar.is-collapsed .remi-brand{height:76px;padding:0;flex-direction:row;justify-content:center;align-items:center;gap:0}
.remi-sidebar.is-collapsed .remi-brand>svg{display:none}
.remi-sidebar.is-collapsed .remi-brand .remi-collapse{margin:0}
.remi-sidebar.is-collapsed .remi-primary-nav{display:flex;padding:6px 10px 0;gap:8px;overflow-x:hidden}
.remi-sidebar.is-collapsed .remi-nav-item{width:44px;height:44px;min-height:44px;padding:0;justify-content:center;gap:0;border-radius:10px}
.remi-sidebar.is-collapsed .remi-nav-item svg{width:20px;height:20px}
.remi-sidebar.is-collapsed .remi-nav-item span,.remi-sidebar.is-collapsed .remi-recent-topics{display:none}
.remi-sidebar.is-collapsed>div:last-child{display:block;padding:12px!important}
.remi-sidebar.is-collapsed>div:last-child>div{display:flex;justify-content:center;padding:0!important;width:40px;height:40px}
.remi-sidebar.is-collapsed>div:last-child>div>div{margin:0;width:30px;height:30px;flex-shrink:0}
.remi-sidebar.is-collapsed>div:last-child span{display:none}

/* Fit the panel to the visible portion of the board scrollport. */
.board-contained-chat.docked-card-chat.floating-card-chat{height:var(--chat-visible-height,min(680px,calc(100dvh - 32px)));max-height:calc(100dvh - 32px);min-height:0;box-sizing:border-box}
.board-contained-chat .card-chat-messages{min-height:0;flex:1 1 0}
.board-contained-chat .sidebar-chat-empty{min-height:0;flex:1}
.board-contained-chat .chatbot-composer-dock{flex:0 0 auto}

/* Select output types through lightweight multi-select tags. */
.composer-output-types{margin:0 0 16px}
.composer-output-types>div{display:flex;gap:8px;flex-wrap:wrap}
.composer-type-tag{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:31px;padding:5px 10px;border:1px solid #e8e3ed;border-radius:8px;background:#fff;color:#93879d;font:400 11px/1.6 -apple-system,"PingFang SC",sans-serif;cursor:pointer;transition:background .16s,border-color .16s,color .16s}
.composer-type-tag>svg{flex-shrink:0;stroke-width:1.7}
.composer-type-tag:hover{background:#faf8fc;border-color:#cdbedb;color:#80668e}
.composer-type-tag.is-selected{background:#f2ebf8;border-color:#cfbddf;color:#806195}
.composer-type-tag .type-tag-check{color:#9e7db8}
.composer-type-tag:focus-visible{outline:2px solid #b7a1c9;outline-offset:2px}
.composer-output-types:disabled .composer-type-tag{cursor:default}

/* Compact tags sit close to the prompt and attachment row. */
.remi-composer .remi-composer-frame:has(.composer-output-types){gap:12px}
.remi-composer .remi-composer-frame:has(.composer-output-types) .composer-prompt{min-height:46px}
.remi-composer-frame:has(.composer-output-types) .composer-prompt>textarea{height:46px;min-height:46px}
.composer-output-types{margin:0;border:0;padding:0}
.composer-output-types>div{gap:6px}
.composer-type-tag{gap:5px;min-height:27px;padding:3px 8px;border-radius:6px;border-color:#ece8f0;color:#93879d;font-size:10px}
.composer-type-tag>svg{width:12px;height:12px;stroke-width:1.8}
.composer-type-tag .type-tag-check{width:10px;height:10px}

/* Output configuration lives beside send, rather than inside the prompt. */
.composer-send-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.composer-output-picker{position:relative;font-size:11px;color:#93849e}
.composer-output-picker>summary{display:flex;align-items:center;gap:5px;width:116px;height:32px;padding:0 7px;box-sizing:border-box;border-radius:7px;cursor:pointer;list-style:none;background:transparent;user-select:none}
.composer-output-picker>summary::-webkit-details-marker{display:none}
.composer-output-picker>summary:hover,.composer-output-picker[open]>summary{background:#f6f2f9;color:#80658f}
.output-picker-count{display:grid;place-items:center;flex:none;width:14px;height:14px;font-size:9px;border-radius:4px;background:#eae0f1;color:#8b6aa2;font-variant-numeric:tabular-nums}
.output-picker-count.is-empty{visibility:hidden}
.composer-output-picker .composer-output-types{position:absolute;z-index:15;bottom:40px;right:0;width:180px;margin:0;padding:5px;border:1px solid #e8e2ee;border-radius:11px;background:#fff;box-shadow:0 8px 26px #31213c12;box-sizing:border-box}
.composer-output-picker .composer-output-types>div{display:flex;flex-direction:column;gap:2px}
.composer-output-picker .composer-type-tag{display:grid;grid-template-columns:14px minmax(0,1fr) 14px;gap:8px;width:168px;height:35px;min-height:35px;padding:0 9px;box-sizing:border-box;text-align:left;border:0;border-radius:6px;font-size:11px;background:#fff}
.composer-output-picker .composer-type-tag.is-selected{background:#f4eef8;color:#816294}
.composer-output-picker .composer-type-tag:hover{background:#f7f4fa}
.composer-output-picker .type-tag-check{width:13px;height:13px}
.composer-output-picker .type-tag-check.is-unchecked{visibility:hidden}
.composer-output-picker summary:focus-visible{outline:2px solid #baa5cc;outline-offset:2px}
.remi-composer .remi-composer-frame:has(.composer-output-picker){gap:16px}
.remi-composer .remi-composer-frame:has(.composer-output-picker) .composer-prompt{min-height:64px}

## 你在 Remi 里管理什么？
**专题**
把同一个项目、课程或小组的资料放在一起。会议记录、文档和后续讨论都可以回到同一条脉络。

**记录**
每次录音或导入音频都会形成一条记录，保留原始资料、转写文本、摘要和待办事项，方便回看。

**资料**
保存与你的专题相关的文档、链接和参考材料。提问时可以选取资料作为上下文，核对回答的出处。

## 三分钟上手
1. 创建一个真实项目的专题。
2. 上传文档或导入录音，保留原始资料。
3. 阅读摘要，核对内容与来源。
4. 围绕资料继续提问，并确认接下来的行动。

        const handleSaveAggregation = () => {

        const [floatingCard, setFloatingCard] = useState(null);

        const closeCardChat = () => {captureReadingAnchor();window.speechSynthesis?.cancel();setSpeakingReply('');setFloatingCard(null);};
        useEffect(()=>{
          const grid=boardGridRef.current;if(!grid)return;
          const observer=new ResizeObserver(entries=>{const width=entries[0].contentRect.width;const n=width>=960?3:width>=600?2:1;setBoardColumns(prev=>{if(prev!==n && !readingAnchor.current)captureReadingAnchor();return n;});});
          observer.observe(grid);return ()=>observer.disconnect();
        },[viewMode]);
        useEffect(()=>{
          const anchor=readingAnchor.current;if(!anchor)return;
          const frame=requestAnimationFrame(()=>{

        const [inlineThreads, setInlineThreads] = useState({});

          utterance.onend=utterance.onerror=()=>{if(speechToken.current===token)setSpeakingReply('');};
          setSpeakingReply(key);speech.speak(utterance);
        };
        const copyCardReply = async (key,text) => {try{await navigator.clipboard.writeText(text);setCopiedCardReply(key);}catch{setCopiedCardReply('');}};
        const ReplyToolIcon = ({kind}) => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.65" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{kind==='sound'?<><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></>:kind==='stop'?<rect x="6" y="6" width="12" height="12" rx="2"/>:kind==='up'?<><path d="M7 10v11H3V10zM7 10l5-7c2 0 2 2 1 6h6a2 2 0 0 1 2 2l-2 8a2 2 0 0 1-2 2H7"/></>:kind==='down'?<><path d="M7 14V3H3v11zM7 14l5 7c2 0 2-2 1-6h6a2 2 0 0 0 2-2l-2-8a2 2 0 0 0-2-2H7"/></>:<><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></>}</svg>;
        const renderCardReplyTools = (item,message,i) => {

              summary:'这份访谈的重点是：用户的问题不只在于**找到文件**，还在于找回之前的阅读位置。\n\n**三个具体问题**\n- 入口难找：常用资料藏在多层目录中。\n- 命名相近：仅凭标题难以区分资料。\n- 位置丢失：返回列表后需要重新翻找。\n\n**可以先验证**\n给常用资料一个直接入口，并测试“返回后保留位置”是否能减少重复查找。',
              'mine-clearance':'两个项目都安排小李参与周五的访谈，**15:00–16:00 存在时间重叠**。\n\n- 适老化调研：14:00–16:00。\n- 社区服务研究：15:00–17:00。\n\n可以先确认两场访谈能否调整时间，或是否有人能够替代参与。调整前请分别核对两份访谈安排。'
            };
            const isPresetQuestion=(item.actions || []).includes(question.trim());
            const answer=isPresetQuestion ? answers[item.type] : '这条追问已保留。当前是**交互预览**，尚未接入模型，暂时无法根据新的问题生成回答。';
            setInlineThreads(prev => {const thread=prev[item.id];if(!thread)return prev;return {...prev,[item.id]:{...thread,pending:false,messages:[...thread.messages,{role:'assistant',elapsedMs:performance.now()-replyStarted,preset:isPresetQuestion,text:answer || '当前预览暂未配置这类卡片的回复。'}]}};});

        const openInlineChat = (item, question, event) => {startConversation(item);};

            <div className="card-chat-messages" role="log" aria-live="polite" ref={el=>{if(!el)return;const count=String(thread.messages.length), changedThread=el.dataset.threadId!==String(item.id);if(changedThread || el.dataset.messageCount!==count){const nearBottom=el.scrollHeight-el.scrollTop-el.clientHeight<70;if(changedThread || thread.messages.length<=2)el.scrollTop=0;else if(nearBottom || thread.messages[thread.messages.length-1]?.role==='user')el.scrollTop=el.scrollHeight;el.dataset.threadId=String(item.id);el.dataset.messageCount=count;}}}>

              {thread.messages.map((message,i)=><div key={i} className={`card-chat-message ${message.role}`}>
                {message.role==='assistant' ? <div className="card-answer-content"><details className="reply-run-details"><summary><span>用时 {Math.max(.1,message.elapsedMs/1000).toFixed(1)} 秒</span><ChevronRight size={13}/></summary><div><span>当前卡片</span><p>{item.title}</p><span>回复方式</span><p>{message.preset?'展示此问题对应的预设回复':'保留追问，说明模型尚未接入'}</p></div></details><div className="card-answer-identity"><span className="card-answer-logo" aria-hidden="true"><svg className="discovery-remi-logo" viewBox="0 0 25 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

              <path d="M16.9668 26.3701C16.5871 28.242 14.7969 29.6592 12.6445 29.6592C10.9887 29.6591 9.54696 28.8204 8.79688 27.5811L16.9668 26.3701Z" fill="black"/>
              <path d="M12.291 2.1084V5.15625C12.291 8.69106 15.2944 11.448 18.7715 11.2021C18.7779 11.3562 18.7818 11.5111 18.7832 11.667L17.5801 11.8223C14.556 12.2104 12.291 14.7851 12.291 17.834V21.4893C12.2342 21.4913 12.1773 21.4961 12.1201 21.4961C12.026 21.4961 11.9321 21.491 11.8389 21.4854V19.4482C11.8389 15.9764 8.94167 13.2565 5.54395 13.3936C5.52599 13.2356 5.51069 13.0764 5.49805 12.916L6.5498 12.7812C9.57369 12.3929 11.8388 9.81922 11.8389 6.77051V2.1123C11.9321 2.10668 12.026 2.10254 12.1201 2.10254C12.1773 2.10254 12.2342 2.10631 12.291 2.1084Z" fill="#7F56D9"/>

                        </div>
                        {viewMode === 'board' && <div className="composer-context-heading"><span className="composer-mode-label"><Search size={15}/><span>搜索</span></span>{droppedItems.length > 1 && <details className="composer-output-picker" onKeyDown={e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();e.currentTarget.open=false;e.currentTarget.querySelector('summary')?.focus();}}} onBlur={e=>{if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.open=false;}}><summary data-tooltip="生成卡片" aria-label={`选择生成卡片类型，已选 ${selectedActionTags.length} 项`}><span className="output-picker-icon" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="13" height="15" rx="3" fill="currentColor" opacity=".22"/><rect x="8" y="2" width="13" height="16" rx="3" fill="currentColor"/><path d="M11.5 7h6M11.5 10.5h4" stroke="white" strokeWidth="1.7" strokeLinecap="round"/></svg><i/></span><span>生成卡片</span><span className={`output-picker-count ${selectedActionTags.length ? '' : 'is-empty'}`}>{selectedActionTags.length || 0}</span><ChevronDown size={12}/></summary><div className="composer-output-types" role="group" aria-label="选择生成的卡片类型"><header className="output-menu-header"><div className="output-menu-intro"><strong>卡片类型</strong><p>可多选{selectedActionTags.length > 0 ? ` · 已选 ${selectedActionTags.length} 项` : ''}</p></div><button type="button" className="output-menu-close" aria-label="关闭卡片类型菜单" data-tooltip="关闭" onClick={e=>{const picker=e.currentTarget.closest('details');picker.open=false;picker.querySelector('summary').focus();}}><X size={14}/></button></header>
                              <div>{[{id:'summary',label:'摘要',desc:'提炼资料中的关键内容'},{id:'todo',label:'待办事项',desc:'整理可执行的任务与时间'},{id:'main-thread',label:'主线提取',desc:'梳理资料脉络与关联'},{id:'golden-quote',label:'金句重温',desc:'留下值得回看的表达'},{id:'mine-clearance',label:'冲突提醒',desc:'发现项目之间的时间、资源或要求冲突'}].map(type => {const selected=selectedActionTags.includes(type.id);return <button key={type.id} type="button" className={`composer-type-tag ${selected ? 'is-selected' : ''}`} aria-pressed={selected} disabled={sendPhase !== 'idle'} onClick={() => toggleActionTag(type.id)}><span className="output-type-glyph" data-tooltip={type.desc} aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">{type.id==='summary'?<><path d="M4 6h16M4 12h12M4 18h7"/></>:type.id==='todo'?<><rect x="3" y="4" width="18" height="17" rx="3"/><path d="m7 12 3 3 7-7"/></>:type.id==='main-thread'?<><path d="M3 5v12a2 2 0 0 0 2 2h4M3 11h6M9 5h12M13 11h8M13 19h8"/></>:type.id==='golden-quote'?<><path d="M4 5h6v7H4zM14 5h6v7h-6z" fill="currentColor" stroke="none"/><path d="M10 11c0 4-2 6-5 7M20 11c0 4-2 6-5 7"/></>:<><path d="M12 3 21 7v6c0 5-9 9-9 9s-9-4-9-9V7l9-4Z"/><path d="M12 8v5M12 17h.01"/></>}</svg></span><span className="output-type-label">{type.label}</span><span className="output-option-check" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="m3 8 3 3 7-7" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg></span></button>;})}</div>
                            </div></details>}<button className="composer-exit" type="button" disabled={sendPhase !== 'idle'} onClick={() => {setComposerOpen(false);setDroppedItems([]);setPromptInput('');setSelectedActionTags([]);}} aria-label="退出搜索"><X size={15}/></button></div>}
                      </div>
                    ) : (
                      <div className={`remi-status discovery-status discovery-panel ${refreshMotion ? 'is-refreshing' : ''}`} aria-busy={refreshMotion}>
                        <span className="discovery-pointer-light" aria-hidden="true"/>
                        <div className="discovery-status-copy" role="status" aria-live="polite">
                          <div className="discovery-copy-lines">
                            <span className="discovery-eyebrow">{refreshMotion ? '正在回顾最近的记录…' : lastRefreshAt ? '最近一次整理' : '你的资料里，有这些发现'}</span>
                            {!refreshMotion && <span className="discovery-summary">{pendingActionCount > 0 ? <><b>{pendingActionCount}</b> 条新记录待整理</> : refreshChecked ? '暂时没有新发现' : <>已整理 <b>{inspirations.length}</b> 条发现</>}</span>}
                          </div>
                        </div>
                        <div className="discovery-status-actions">
                          <time className="discovery-refresh-time">{refreshMotion ? `${(refreshElapsed / 1000).toFixed(1)}s` : lastRefreshAt ? lastRefreshAt.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) : ''}</time>
                          <div className="discovery-tools" role="group" aria-label="发现工具">
                            <button type="button" className="discovery-refresh" disabled={refreshMotion} onClick={refreshDiscovery} data-tooltip="刷新发现" aria-label={refreshMotion ? '正在刷新发现' : '刷新发现'}><RefreshCw size={19}/></button>
                            <button type="button" className="discovery-search-entry" data-tooltip="搜索" aria-label="搜索" disabled={refreshMotion} onClick={() => setComposerOpen(true)}><Search size={19}/></button>
                          </div>
                        </div>
                      </div>
                    )}
<div className="toolbar-send-status" role="status" aria-live="polite">{sendPhase === "sending" ? "发送中" : sendPhase === "sent" ? <><CheckCircle2 size={12}/>已发送</> : ""}</div>
                  </div>

                  {/* 近期动态 (画板模式) */}
                  {viewMode === 'board' && (
                    <div className="activity-section mb-10 w-full relative">
                      <div className="flex justify-between items-end mb-4">
                        <div>
                          <h3 className="text-[13px] font-semibold text-gray-900 mb-1">最近使用</h3>

                        </div>

                      </div>

                      <div
                        ref={scrollRef}
                        className={"recent-resource-track flex overflow-x-auto scroll-smooth snap-x no-scrollbar" + (activityScroll.right ? " has-more-right" : "")}
                        style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}
                      >
                        {recentActivities.map(activity => (
                          <article role="button" tabIndex={0} aria-label={`添加 ${activity.content} 到搜索`} aria-pressed={droppedItems.some(item => item.id === activity.id)} onClick={() => addRecentContext(activity)} onKeyDown={e => {if(e.key === 'Enter' || e.key === ' '){e.preventDefault();addRecentContext(activity);}}} key={activity.id} draggable={true} onDragStart={(e) => handleDragStart(e, activity)} onDragEnd={handleDragEnd} className={`recent-resource ${recentActivities.length === 1 ? 'is-only' : ''} ${String(draggedItemId) === String(activity.id) ? 'is-dragging' : ''}`}>
                            <span className={`recent-resource-icon ${activity.type}`} aria-hidden="true"><ResourceGlyph type={activity.type} name={activity.content} size={38}/></span>
                            <div className="recent-resource-copy">
                              <p className="recent-resource-title" data-tooltip={`${activity.content} · ${activity.tag} · ${activity.time}`} aria-label={`${activity.content}，${activity.tag}，${activity.time}`}>{activity.content}</p>
                              <div className="recent-resource-meta"><span className="recent-resource-topic" data-tooltip={activity.topic}><FileText size={12}/><span>{activity.topic}</span></span></div>
                            </div>
                            <span className="recent-add-context" aria-hidden="true">{droppedItems.some(item => item.id === activity.id) ? <CheckCircle2 size={16}/> : <Plus size={16}/>}</span>
                          </article>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* AI 聚合预览 / 详情 / 正常画板 */}
                  {viewMode === 'preview' || viewMode === 'detail' ? (
                    <div className="animate-in slide-in-from-bottom-4 fade-in duration-400 pb-10 mt-6 max-w-4xl mx-auto w-full">
                      <div className="bg-[#f8f9fe] rounded-3xl p-8 border border-[#e2e8f0] shadow-sm relative mb-10">
                        <div className="flex justify-between items-start mb-6">
                          <div className="flex items-center text-[#8b5cf6] font-bold text-[14px] tracking-wide">
                            <Sparkles size={18} className="mr-2" /> AI 灵感聚合
                          </div>
                          {viewMode === 'preview' && (
                            <div className="flex items-center space-x-3">
                              <button onClick={() => { setViewMode('board'); setDroppedItems([]); setSelectedActionTags([]); setPromptInput(''); setCurrentAggregation(null); }} className="text-gray-500 hover:bg-gray-200/50 hover:text-gray-800 px-4 py-2.5 rounded-xl text-[13px] font-bold transition-colors">
                                忽略
                              </button>
                              <button onClick={handleSaveAggregation} className="bg-[#6366f1] hover:bg-[#4f46e5] text-white px-5 py-2.5 rounded-xl text-[13px] font-bold flex items-center transition-colors shadow-md">
                                <Bookmark size={14} className="mr-2" /> 保存为灵感聚合
                              </button>
                            </div>
                          )}
                        </div>
                        <h2 className="text-[22px] font-bold text-gray-900 mb-5">{currentAggregation?.title}</h2>
                        <p className="text-gray-600 text-[14px] leading-loose">{currentAggregation?.desc}</p>
                      </div>

                      <div className="flex items-center justify-center my-10 relative">
                        <div className="absolute w-full h-px bg-gray-200"></div>
                        <span className="bg-[#fafafa] px-5 text-[13px] text-gray-400 relative z-10">
                          以下是基于选定内容的 <span className="text-[#8b5cf6] font-bold tracking-wide">灵感流</span>
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full">
                        {currentAggregation?.cards?.map((item, index) => (
                          <React.Fragment key={index}>
                            {renderCard(item)}
                          </React.Fragment>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <section className="inspiration-section">
                      <div className="board-section-heading flex justify-between items-end mb-5">
                        <div>
                          <h3 className="text-[13px] font-semibold text-gray-900 mb-1">灵感看板</h3>

                        </div>
                        <button onClick={() => startConversation({title:'全部资料',sources:[]})} className="flex items-center px-4 py-2 bg-white border border-gray-200 rounded-full text-[12px] font-bold text-gray-600 hover:bg-gray-50 shadow-sm transition">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M12 3.5c-5.2 0-9 3.1-9 7.2 0 2.3 1.2 4.3 3.4 5.6L5.5 20l4.4-2.2c.7.1 1.4.2 2.1.2 5.2 0 9-3.1 9-7.3s-3.8-7.2-9-7.2Z" fill="currentColor"/><path d="M8.5 10.7h7" stroke="#202124" stroke-width="1.8" stroke-linecap="round"/></svg>
                          问问 Remi
                        </button>
                      </div>
                      <div className="board-type-tabs" role="tablist" aria-label="按卡片类型筛选" onKeyDown={e=>{const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(e.key))return;e.preventDefault();const tabs=Array.from(e.currentTarget.querySelectorAll('[role=tab]'));const index=tabs.indexOf(document.activeElement);const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].click();tabs[next].focus();tabs[next].scrollIntoView({block:'nearest',inline:'nearest'});}}>
                        {boardTypes.map(([type,label])=><button key={type} type="button" role="tab" id={'board-type-'+type} aria-selected={boardType===type} aria-controls="board-type-results" tabIndex={boardType===type?0:-1} className={boardType===type?'is-active':''} onClick={()=>setBoardType(type)}>{label}</button>)}
                      </div>
                      <div className={`board-conversation-layout ${floatingCard ? 'is-chatting' : ''}`}>
                      <div role="tabpanel" id="board-type-results" aria-labelledby={"board-type-"+boardType} tabIndex={0} ref={boardGridRef} className="sidebar-aware-grid" style={{display:'grid',gridTemplateColumns:`repeat(${boardColumns}, minmax(0, 1fr))`,gap:16,alignItems:'start'}}>
                        {visibleBoardCards.length ? renderMasonryColumns(visibleBoardCards,boardColumns) : <div className="board-type-empty">暂无这类卡片</div>}
                      </div>
                      {floatingCard && renderInlineChat(floatingCard)}
                      </div>
                    </section>
                  )}
                </div>

                {isRightPanelOpen && rightPanelType === 'chat' && <><div className="conversation-backdrop" onClick={closeConversation} aria-hidden="true"/><section className="remi-conversation" role="dialog" aria-modal="true" aria-label="Remi 对话" onKeyDown={e => {
                    if(e.key === 'Escape'){e.stopPropagation();closeConversation();}
                    if(e.key === 'Tab'){const controls=Array.from(e.currentTarget.querySelectorAll('button:not(:disabled),textarea,summary'));const first=controls[0],last=controls[controls.length-1];if(e.shiftKey && document.activeElement === first){e.preventDefault();last?.focus();}else if(!e.shiftKey && document.activeElement === last){e.preventDefault();first?.focus();}}
                  }}>
                  <header className="conversation-header">
                    <button className="conversation-back" aria-label="关闭对话" data-tooltip="关闭（Esc）" onClick={closeConversation}><X size={18}/></button>
                    <span className="conversation-brand">Remi</span>
                    <span className="conversation-header-spacer"/>
                  </header>
                  <div className="conversation-thread" ref={conversationThreadRef}>
                    <div className="conversation-column">
                      {chatContext && <details className="conversation-context"><summary><span className="conversation-context-icon"><Book size={16}/></span><span>{chatContext.title}</span><ChevronDown size={14}/></summary><div>{chatContext.quote && <p>{chatContext.quote.replace(/^["“]|["”]$/g,'')}</p>}{chatContext.sources?.length > 0 && <div className="conversation-sources">{chatContext.sources.map((source,i)=><span key={i}><FileText size={12}/>{source}</span>)}</div>}</div></details>}
                      {chatMessages.length === 0 && <div className="conversation-empty"><MessageSquare size={28} strokeWidth={1.4}/><h2>想聊些什么？</h2></div>}
                      {chatMessages.map(msg => <div key={msg.id} className={`conversation-message ${msg.sender === 'user' ? 'from-user' : 'from-remi'}`}>
                        {msg.sender !== 'user' && <span className="conversation-author">Remi</span>}
                        <div>{msg.text.split('\n').map((line,i)=><React.Fragment key={i}>{line.startsWith('**') ? <strong>{line.replace(/\*\*/g,'')}</strong> : line}{i < msg.text.split('\n').length - 1 && <br/>}</React.Fragment>)}</div>
                      </div>)}
                    </div>
                  </div>
                  <div className="conversation-input-area"><div className="conversation-input-column"><div className="conversation-input-box">
                    <textarea aria-label="向 Remi 提问" rows={2} value={chatInput} autoFocus onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>{if(e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing){e.preventDefault();submitChatInput();}}} placeholder="继续提问…"/>
                    <button disabled={!chatInput.trim()} onClick={submitChatInput} aria-label="发送" data-tooltip="发送（Enter）"><ArrowUp size={18}/></button>
                  </div></div></div>
                </section></>}


              </div>
            </div>
          </div>
        );
      };

      /* ── 路由渲染 ── */
      return (
        <div className="remi-app-theme font-sans text-gray-900 h-screen w-full flex overflow-hidden">
          {(currentRoute === 'home' || currentRoute === 'topics' || currentRoute === 'inspiration' || currentRoute === 'conversation') && (
            <>
              <GlobalSidebar />
              {currentRoute === 'conversation' ? <ConversationWorkspace conversation={conversations.find(c=>c.id===activeConversationId)||conversations[0]} onSend={sendConversationMessage} onFeedback={(id,messageId,value)=>setConversations(prev=>prev.map(c=>c.id===id?{...c,messages:c.messages.map(m=>m.id===messageId?{...m,feedback:m.feedback===value?null:value}:m)}:c))} onSaveReply={saveConversationReply} onModelChange={(id,model)=>setConversations(prev=>prev.map(c=>c.id===id?{...c,model}:c))} onAttach={(id,names)=>setConversations(prev=>prev.map(c=>c.id===id?{...c,context:{...c.context,sources:[...new Set([...(c.context?.sources||[]),...names])]}}:c))} onHome={()=>navigateTo('home')} onNew={()=>startConversation()} onClearReference={id=>setConversations(prev=>prev.map(c=>c.id===id?{...c,context:{title:'全部资料',sources:[]}}:c))}/> : currentRoute === 'home' ? <HomeWorkspace inspirations={inspirations} topics={topics} recentActivities={recentActivities} chatMessages={chatMessages} handleSendMessage={handleSendMessage} navigateTo={navigateTo} setRecentActivities={setRecentActivities} startConversation={startConversation} savedConversations={conversations} reopenConversation={reopenConversation}/> : currentRoute === 'topics' ? <TopicsView /> : <InspirationView />}
            </>
          )}
          {currentRoute === 'topic-detail' && (
            <TopicWorkspace inspirations={inspirations} setInspirations={setInspirations} navigateTo={navigateTo} chatMessages={chatMessages} handleSendMessage={handleSendMessage} />
          )}
        </div>
      );
    }

    /* ── 挂载 ── */
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
