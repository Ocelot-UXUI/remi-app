<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remi - AI记忆助手</title>
  <script src="./vendor/react.min.js"></script>
  <script src="./vendor/react-dom.min.js"></script>
  <script src="./vendor/babel.min.js"></script>
  <script src="./vendor/tailwind.js"></script>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.getElementById('root').innerHTML =
        '<div style="padding:20px;color:red;font-family:monospace;white-space:pre-wrap">' +
        '<b>JS 报错</b><br>' + msg + '<br>行:' + line + ' 列:' + col +
        (err ? '<br>' + err.stack : '') + '</div>';
      return false;
    };
  </script>
  <style>
    /* ====== tailwindcss-animate 兼容动画系统 ====== */
    .animate-in {
      --enter-opacity: 1;
      --enter-scale: 1;
      --enter-translate-x: 0;
      --enter-translate-y: 0;
      --anim-dur: 150ms;
      animation: tw-enter var(--anim-dur) cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes tw-enter {
      from {
        opacity: var(--enter-opacity);
        transform: translate3d(var(--enter-translate-x), var(--enter-translate-y), 0)
                   scale3d(var(--enter-scale), var(--enter-scale), 1);
      }
    }
    .fade-in               { --enter-opacity: 0; }
    .zoom-in-95            { --enter-scale: 0.95; }
    .slide-in-from-bottom-4 { --enter-translate-y: 1rem; }
    .slide-in-from-right-4  { --enter-translate-x: 1rem; }
    .slide-in-from-top-2    { --enter-translate-y: -0.5rem; }
    .duration-200 { --anim-dur: 200ms; }
    .duration-300 { --anim-dur: 300ms; }
    .duration-400 { --anim-dur: 400ms; }

    /* ====== Line-clamp ====== */
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* ====== 全局 Scrollbar 隐藏 ====== */
    .no-scrollbar::-webkit-scrollbar, .hide-scrollbar::-webkit-scrollbar { display: none; }

    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #root { height: 100vh; width: 100vw; overflow: hidden; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    /* ============================================================
       图标系统 (Lucide 图标 → 内联 SVG React 组件)
    ============================================================ */
    function createIcon(svgPaths) {
      return function LucideIcon({ size = 24, className = '', strokeWidth = 2, style, onClick }) {
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width={size} height={size}
            viewBox="0 0 24 24"
            fill="none" stroke="currentColor"
            strokeWidth={strokeWidth}
            strokeLinecap="round" strokeLinejoin="round"
            className={className} style={style}
            onClick={onClick}
            dangerouslySetInnerHTML={{ __html: svgPaths }}
          />
        );
      };
    }

    const Search        = createIcon('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>');
    const Book          = createIcon('<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>');
    const FileText      = createIcon('<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>');
    const User          = createIcon('<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>');
    const Mic           = createIcon('<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>');
    const Upload        = createIcon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>');
    const Plus          = createIcon('<path d="M5 12h14"/><path d="M12 5v14"/>');
    const ChevronDown   = createIcon('<path d="m6 9 6 6 6-6"/>');
    const Home          = createIcon('<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>');
    const Layout        = createIcon('<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/>');
    const PanelRightClose = createIcon('<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m8 9 3 3-3 3"/>');
    const Sparkles      = createIcon('<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>');
    const RefreshCw     = createIcon('<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>');
    const MessageSquare = createIcon('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>');
    const ArrowUp       = createIcon('<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>');
    const X             = createIcon('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>');
    const Link          = createIcon('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>');
    const Grip          = createIcon('<circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/>');
    const Glasses       = createIcon('<circle cx="6" cy="15" r="4"/><circle cx="18" cy="15" r="4"/><path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"/><path d="M21.5 13 19 7c-.7-1.3-1.5-2-3-2"/>');
    const ShieldAlert   = createIcon('<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/>');
    const ChevronLeft   = createIcon('<path d="m15 18-6-6 6-6"/>');
    const ChevronRight  = createIcon('<path d="m9 18 6-6-6-6"/>');
    const Bookmark      = createIcon('<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>');
    const CheckCircle2  = createIcon('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>');
    const ListTree      = createIcon('<path d="M21 12h-8"/><path d="M21 6H8"/><path d="M21 18h-8"/><path d="M3 6v4c0 1.1.9 2 2 2h3"/><path d="M3 10v6c0 1.1.9 2 2 2h3"/>');
    const Clock         = createIcon('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>');
    const Copy          = createIcon('<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>');

    /* ============================================================
       App 主组件
    ============================================================ */
    function App() {
      const [currentRoute, setCurrentRoute] = useState('topics');
      const [isRightPanelOpen, setIsRightPanelOpen] = useState(false);
      const [rightPanelType, setRightPanelType] = useState(null);
      const [fileDetailTab, setFileDetailTab] = useState('source');

      const [topics, setTopics] = useState([
        {
          id: 1, title: 'Remi使用教程', date: '今天',
          recentActivity: '从建立主题开始使用remi吧',
          desc: '从 0 开始上手 Remi：创建主题 → 导入文件或开始录音 → 自动转写与总结 → 生成待办与结论 → 一键归档与回看。附常见问题与最佳实践。'
        }
      ]);

      const [isNewTopicModalOpen, setIsNewTopicModalOpen] = useState(false);
      const [uploadState, setUploadState] = useState('idle');

      const [chatMessages, setChatMessages] = useState([]);
      const [inputValue, setInputValue] = useState('');

      const [pendingActionCount, setPendingActionCount] = useState(0);
      const [readyCount, setReadyCount] = useState(0);
      const [topBarState, setTopBarState] = useState('default');

      const [inspirations, setInspirations] = useState([
        {
          id: 1, type: 'summary', tagText: '摘要',
          title: '从建立主题开始使用remi吧',
          desc: '从 0 开始上手 Remi：创建主题 → 导入文件或开始录音 → 自动转写与总结 → 生成待办与结论...',
          link: 'Remi使用教程-从建立主题开始使用remi吧',
          actions: ['使用remi有什么好处？', '如何使用remi？']
        }
      ]);

      const getCurrentTimeStr = () => {
        const now = new Date();
        return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      };

      const [recentActivities, setRecentActivities] = useState([
        { id: 1, type: 'document', time: '18:30', tag: '文档', content: 'remi使用案例.txt', topic: '毕业小组讨论-后续分工表' }
      ]);

      const simulateExternalImport = () => {
        const files = ['设计规范.pdf', '面试录音.mp3', '需求文档v2.docx', '2026-02-23 19:21记录.md'];
        const randomFile = files[Math.floor(Math.random() * files.length)];
        const isAudio = randomFile.endsWith('.mp3');
        const newActivity = {
          id: Date.now(), type: isAudio ? 'recording' : 'document',
          time: getCurrentTimeStr(), tag: isAudio ? '录音' : '文档',
          content: randomFile, topic: '毕业小组讨论-后续分工表'
        };
        setRecentActivities(prev => [newActivity, ...prev]);
        setPendingActionCount(prev => prev + 1);
      };

      const simulateExternalChat = () => {
        const chats = [
          '"假设你是一名ux的面试官，根据我的作品集内容..."',
          '"帮我总结一下面试官对我的挑战"'
        ];
        const randomChat = chats[Math.floor(Math.random() * chats.length)];
        const newActivity = {
          id: Date.now(), type: 'conversation', time: getCurrentTimeStr(),
          tag: '对话', content: randomChat, topic: '大四实习申请'
        };
        setRecentActivities(prev => [newActivity, ...prev]);
        setPendingActionCount(prev => prev + 1);
      };

      const handleRefresh = () => {
        if (pendingActionCount > 0) {
          setTopBarState('ready');
          setReadyCount(prev => prev + pendingActionCount);

          const newCards = Array.from({ length: pendingActionCount }).map((_, i) => {
            const id = Date.now() + i;
            const cardTypes = ['summary', 'golden-quote', 'mine-clearance', 'main-thread', 'todo'];
            const selectedType = cardTypes[Math.floor(Math.random() * cardTypes.length)];

            if (selectedType === 'summary') {
              return {
                id, type: 'summary', tagText: '摘要',
                title: '近期访谈记录核心总结',
                desc: '过去两天内的三场用户访谈中，受访者普遍提到了"信息层级不够清晰"和"深色模式刺眼"两个问题。建议在下个迭代中重点优化视觉对比度。',
                link: '用户调研访谈录音合集',
                actions: ['帮我提取所有用户的原话', '整理一份视觉优化建议单']
              };
            } else if (selectedType === 'main-thread') {
              return {
                id, type: 'main-thread', tagText: '主线提取',
                title: '两份资料之间，缺一张草图',
                subtitle: '基于你近期浏览交互基础相关资料，已提取核心关联',
                quote: '当前的破局点在于：如何将《交互基础》中的理论原则，具体拆解并分配到《后续分工表》的研发任务中。两者之间缺乏一个可视化的"原型草图"作为过渡桥梁。',
                link: ['毕设小组讨论-后续分工表', '毕设小组讨论-交互设计基础'],
                actions: ['基于此主线，帮我生成原型图', '结合交互理论，评估目前分工是否合理']
              };
            } else if (selectedType === 'todo') {
              return {
                id, type: 'todo', tagText: '待办事项',
                title: '城市空间适老化改造调研', subtitle: '资料收集期结束，进入分析瓶颈。',
                todos: [
                  { text: '田野数据采集', assignee: '@小李', time: '明天下午前' },
                  { text: '案头文献积累', assignee: '@全体成员', time: '2月28日', link: '毕设小组讨论-会议讨论' }
                ],
                actions: ['田野数据采集的要点是什么', '帮我基于时间限制做个排期']
              };
            } else if (selectedType === 'mine-clearance') {
              const concepts1 = ['麦克卢汉', '定性研究', '敏捷开发'];
              const concepts2 = ['波兹曼', '定量研究', '瀑布流'];
              const rIdx = Math.floor(Math.random() * concepts1.length);
              const c1 = concepts1[rIdx];
              const c2 = concepts2[rIdx];
              return {
                id, type: 'mine-clearance', tagText: '排雷', title: `"${c1}"和"${c2}"观点概念纠错`,
                subtitle: `检测到论文中对"${c1}"和"${c2}"的概念有所混淆，需进行修改`,
                quote: `"……正如${c1}与${c2}所共同指出的那样，这一概念的普及，必然会导致受众群体…"`,
                link: '毕业小组讨论-后续分工表', actions: ['帮我解释一下这两个核心区别', '结合语境，帮我重写这段话']
              };
            } else {
              const concepts = ['系统可控', '沉浸式体验', '极简设计', '渐进式呈现'];
              const concept = concepts[Math.floor(Math.random() * concepts.length)];
              return {
                id, type: 'golden-quote', tagText: '金句重温', title: '金句重温',
                subtitle: `检测到近期多次提到"${concept}"相关概念`,
                quote: `"不要让系统替用户做决定，而是提供${concept.includes('可控') ? '可控的选项' : '自然引导'}。"`,
                link: '论文开题答辩-交互设计基础', actions: ['解释一下这个观点', `根据这个观点，帮我分析近期资料`]
              };
            }
          });
          setInspirations(prev => [...newCards, ...prev]);
          setPendingActionCount(0);
        }
      };

      const navigateTo = (route) => {
        setCurrentRoute(route);
        if (route === 'topic-detail') {
          setIsRightPanelOpen(true);
          setRightPanelType('file-detail');
          setFileDetailTab('source');
        } else {
          setIsRightPanelOpen(false);
          setRightPanelType(null);
        }
      };

      const openFileDetail = () => {
        setIsRightPanelOpen(true);
        setRightPanelType('file-detail');
        setFileDetailTab('source');
      };

      const openChatbot = (initialQuestion = null) => {
        setIsRightPanelOpen(true);
        setRightPanelType('chat');
        if (initialQuestion && typeof initialQuestion === 'string') {
          handleSendMessage(initialQuestion);
        }
      };

      const handleSendMessage = (text) => {
        if (!text || typeof text !== 'string' || !text.trim()) return;
        const newUserMsg = { id: Date.now(), text, sender: 'user' };
        setChatMessages(prev => [...prev, newUserMsg]);
        setInputValue('');

        const newActivity = {
          id: Date.now() + 1, type: 'conversation', time: getCurrentTimeStr(),
          tag: '对话', content: `"${text}"`, topic: currentRoute === 'topic-detail' ? 'Remi使用教程' : '灵感看板探索'
        };
        setRecentActivities(prev => [newActivity, ...prev]);
        setPendingActionCount(prev => prev + 1);

        setTimeout(() => {
          let aiResponse = "这是一个模拟的回复。";
          if (text.includes("好处")) {
            aiResponse = `用 Remi 的好处，可以用一句话概括：\n\n它不是帮你"存更多"，而是帮你"更快回到当时怎么想的"，并把下一步推到你面前。\n\n**1) 回忆成本更低：更快找到"为什么存它"**\n传统找文件：找到文件 ≠ 想起用途\nRemi：把文件、对话、行动放进同一条脉络里...`;
          }
          setChatMessages(prev => [...prev, { id: Date.now(), text: aiResponse, sender: 'ai' }]);
        }, 600);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadState('uploading');
        setTimeout(() => {
          const autoGeneratedTitle = file.name.replace(/\.[^/.]+$/, "");
          const newTopic = {
            id: Date.now(), title: autoGeneratedTitle, date: '刚刚',
            recentActivity: '新文件导入', desc: `已基于您上传的文件 "${file.name}" 自动分析并为您生成专属主题知识库，现在可以向它提问了。`
          };
          setTopics(prev => [newTopic, ...prev]);

          const newActivity = {
            id: Date.now() + 1, type: file.type.includes('audio') || file.type.includes('video') ? 'recording' : 'document',
            time: getCurrentTimeStr(), tag: file.type.includes('audio') || file.type.includes('video') ? '录音' : '文档',
            content: file.name, topic: autoGeneratedTitle
          };
          setRecentActivities(prev => [newActivity, ...prev]);
          setPendingActionCount(prev => prev + 1);

          setUploadState('idle');
          setIsNewTopicModalOpen(false);
        }, 1500);
      };

      /* ── 全局侧边栏 ── */
      const GlobalSidebar = () => (
        <div className="w-[220px] bg-white border-r border-gray-100 flex flex-col h-full flex-shrink-0 relative z-10">
          <div className="p-5 flex items-center space-x-2">
            <div className="w-7 h-7 bg-purple-600 rounded-lg flex items-center justify-center text-white font-bold">
              <Sparkles size={16} />
            </div>
            <span className="text-lg font-bold tracking-tight">remi</span>
          </div>
          <div className="px-4 mb-6">
            <div className="relative">
              <Search className="absolute left-3 top-2 text-gray-400" size={14} />
              <input type="text" placeholder="全局搜索" className="w-full bg-gray-50 border border-gray-200 rounded-full py-1.5 pl-8 pr-4 text-[13px] focus:outline-none focus:ring-1 focus:ring-purple-500" />
            </div>
          </div>
          <div className="flex-1 px-3 space-y-1">
            <div className="px-3 py-2 text-sm font-semibold text-gray-900 flex items-center bg-gray-50 rounded-lg mb-2">
              <Book size={16} className="mr-2 text-gray-500" />
              知识库
            </div>
            <button onClick={() => navigateTo('topics')} className={`w-full flex items-center px-3 py-2 text-sm rounded-lg transition-colors ${currentRoute === 'topics' ? 'bg-purple-50 text-purple-700 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
              主题
            </button>
            <button onClick={() => navigateTo('inspiration')} className={`w-full flex items-center px-3 py-2 text-sm rounded-lg transition-colors ${currentRoute === 'inspiration' ? 'bg-gray-100 text-gray-900 font-medium' : 'text-gray-600 hover:bg-gray-50'}`}>
              灵感看板
            </button>
            <button className="w-full flex items-center px-3 py-2 text-sm rounded-lg text-gray-600 hover:bg-gray-50 transition-colors">
              <FileText size={16} className="mr-2" />
              我的资料
            </button>
          </div>
          <div className="px-3 pb-4">
            <div className="px-3 py-2 text-[11px] font-bold text-gray-400 flex items-center tracking-wider mb-1">
              <span className="w-1.5 h-1.5 rounded-full bg-green-500 mr-2 animate-pulse"></span>
              动作模拟器 (测试)
            </div>
            <div className="space-y-1">
              <button onClick={simulateExternalImport} className="w-full flex items-center px-3 py-2 text-sm rounded-lg text-blue-600 hover:bg-blue-50 transition-colors">
                <Upload size={14} className="mr-2" />
                模拟导入文件
              </button>
              <button onClick={simulateExternalChat} className="w-full flex items-center px-3 py-2 text-sm rounded-lg text-green-600 hover:bg-green-50 transition-colors">
                <MessageSquare size={14} className="mr-2" />
                模拟外部对话
              </button>
            </div>
          </div>
          <div className="p-4 border-t border-gray-100">
            <div className="flex items-center space-x-3 px-3 py-2 rounded-lg border border-gray-200 cursor-pointer hover:bg-gray-50">
              <div className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center">
                <User size={16} className="text-gray-500" />
              </div>
              <span className="text-sm font-medium">st123456</span>
            </div>
          </div>
        </div>
      );

      /* ── 主题列表页 ── */
      const TopicsView = () => (
        <div className="flex-1 overflow-auto bg-[#fafafa]">
          <div className="max-w-5xl mx-auto px-10 py-20">

          setDraggedItemId(activity.id);
          e.dataTransfer.setData('text/plain', String(activity.id));

        const handleDragEnd = () => {
          setDraggedItemId(null);
          setIsOverTopBar(false);
        };

          }

        };

                          )}
                        </div>
                        <div className="flex space-x-2 pr-2 flex-shrink-0 relative">
                          <button onClick={handleRefresh} className="flex items-center px-4 py-1.5 text-[12px] text-gray-600 hover:bg-gray-100 rounded-full transition font-medium relative">
                            <RefreshCw size={13} className="mr-1.5" />刷新
                            {pendingActionCount > 0 && <span className="absolute top-1 right-2 w-2 h-2 bg-red-500 rounded-full border border-white"></span>}
                          </button>
                          <button className="flex items-center px-5 py-1.5 bg-gray-50 border border-gray-200 text-gray-700 rounded-full text-[12px] font-bold hover:bg-gray-100 transition">
                            <Search size={13} className="mr-1.5" />搜索
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* 近期动态 (画板模式) */}
                  {viewMode === 'board' && (
                    <div className="mb-10 w-full relative">
                      <div className="flex justify-between items-end mb-4">
                        <div>
                          <h3 className="text-[13px] font-semibold text-gray-900 mb-1">近期动态</h3>
                          <p className="text-[11px] text-gray-400">展示过去 72 小时的捕获记录 (长按卡片可拖拽至顶栏进行聚合)</p>
                        </div>
                        <div className="flex space-x-2">
                          <button onClick={() => scroll('left')} className="w-7 h-7 flex items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 hover:text-purple-600 transition shadow-sm">
                            <ChevronLeft size={14} />
                          </button>
                          <button onClick={() => scroll('right')} className="w-7 h-7 flex items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 hover:text-purple-600 transition shadow-sm">
                            <ChevronRight size={14} />
                          </button>
                        </div>
                      </div>

                      <div
                        ref={scrollRef}
                        className="flex gap-4 overflow-x-auto scroll-smooth snap-x pb-4 pt-1 px-1 -mx-1 no-scrollbar"
                        style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}
                      >
                        {recentActivities.map(activity => (
                          <div
                            key={activity.id}
                            draggable="true"
                            onDragStart={(e) => handleDragStart(e, activity)}
                            onDragEnd={handleDragEnd}
                            className="bg-white rounded-xl shadow-sm p-4 flex flex-col animate-in fade-in zoom-in-95 duration-300 h-[140px] w-[280px] min-w-[280px] flex-shrink-0 snap-start cursor-grab hover:border-[#a882ff] border border-gray-200 transition-all hover:shadow-md"
                          >
                            <div className="flex items-center text-[12px] text-gray-500 mb-3">
                              <Grip size={13} className="mr-1.5 text-gray-400" />
                              <span className="mr-2 text-gray-700">{activity.time}</span>
                              <span className="bg-gray-100 px-1.5 py-0.5 rounded text-[10px] text-gray-500 font-medium">{activity.tag}</span>
                            </div>

                            {activity.type === 'document' || activity.type === 'recording' ? (
                              <div className="rounded-lg p-2.5 mb-2 flex items-center text-[12px] font-medium border flex-1 bg-gray-50 border-gray-100 text-gray-700">
                                {activity.type === 'document' ? <FileText size={15} className="mr-2 text-gray-400 flex-shrink-0" /> : <Mic size={15} className="mr-2 text-gray-400 flex-shrink-0" />}
                                <span className="truncate">{activity.content}</span>
                              </div>
                            ) : (
                              <div className="text-[13px] leading-relaxed mb-2 flex-1 line-clamp-3 italic text-gray-800">
                                {activity.content}
                              </div>
                            )}

                            <div className="mt-auto">
                              <div className="inline-flex items-center text-[11px] rounded-lg px-2.5 py-1.5 w-full transition-colors text-purple-600 bg-[#faf5ff] hover:bg-purple-100 font-medium">
                                <Link size={12} className="mr-1.5 flex-shrink-0" />
                                <span className="truncate">{activity.topic}</span>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* AI 聚合预览 / 详情 / 正常画板 */}
                  {viewMode === 'preview' || viewMode === 'detail' ? (
                    <div className="animate-in slide-in-from-bottom-4 fade-in duration-400 pb-10 mt-6 max-w-4xl mx-auto w-full">
                      <div className="bg-[#f8f9fe] rounded-3xl p-8 border border-[#e2e8f0] shadow-sm relative mb-10">
                        <div className="flex justify-between items-start mb-6">
                          <div className="flex items-center text-[#8b5cf6] font-bold text-[14px] tracking-wide">
                            <Sparkles size={18} className="mr-2" /> AI 灵感聚合
                          </div>
                          {viewMode === 'preview' && (
                            <div className="flex items-center space-x-3">
                              <button onClick={() => { setViewMode('board'); setDroppedItems([]); setSelectedActionTags([]); setPromptInput(''); setCurrentAggregation(null); }} className="text-gray-500 hover:bg-gray-200/50 hover:text-gray-800 px-4 py-2.5 rounded-xl text-[13px] font-bold transition-colors">
                                忽略
                              </button>
                              <button onClick={handleSaveAggregation} className="bg-[#6366f1] hover:bg-[#4f46e5] text-white px-5 py-2.5 rounded-xl text-[13px] font-bold flex items-center transition-colors shadow-md">
                                <Bookmark size={14} className="mr-2" /> 保存为灵感聚合
                              </button>
                            </div>
                          )}
                        </div>
                        <h2 className="text-[22px] font-bold text-gray-900 mb-5">{currentAggregation?.title}</h2>
                        <p className="text-gray-600 text-[14px] leading-loose">{currentAggregation?.desc}</p>
                      </div>

                      <div className="flex items-center justify-center my-10 relative">
                        <div className="absolute w-full h-px bg-gray-200"></div>
                        <span className="bg-[#fafafa] px-5 text-[13px] text-gray-400 relative z-10">
                          以下是基于选定内容的 <span className="text-[#8b5cf6] font-bold tracking-wide">灵感流</span>
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full">
                        {currentAggregation?.cards?.map((item, index) => (
                          <React.Fragment key={index}>
                            {renderCard(item)}
                          </React.Fragment>
                        ))}
                      </div>
                    </div>
                  ) : (
                    <div>
                      <div className="flex justify-between items-end mb-5">
                        <div>
                          <h3 className="text-[13px] font-semibold text-gray-900 mb-1">灵感看板</h3>
                          <p className="text-[11px] text-gray-400">展示AI为你提取的灵感</p>
                        </div>
                        <button onClick={() => openChatbot()} className="flex items-center px-4 py-2 bg-white border border-gray-200 rounded-full text-[12px] font-bold text-gray-600 hover:bg-gray-50 shadow-sm transition">
                          <Sparkles size={14} className="mr-1.5 text-gray-500" />
                          问问REMI
                        </button>
                      </div>
                      <div className="grid gap-4 items-start w-full" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(250px, 1fr))' }}>
                        {inspirations.map((item, index) => (
                          <React.Fragment key={index}>
                            {renderCard(item)}
                          </React.Fragment>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* 右侧聊天面板 */}
                <div className={`bg-white border border-gray-200 rounded-2xl shadow-2xl flex flex-col flex-shrink-0 transition-all duration-300 ease-in-out overflow-hidden ${
                  isRightPanelOpen && rightPanelType === 'chat' ? 'w-[340px] ml-6 opacity-100' : 'w-0 ml-0 opacity-0 border-none'
                }`}>
                  <div className="w-[340px] h-full flex flex-col">
                    <div className="p-4 border-b border-gray-100 flex items-center justify-between">
                      <div className="flex items-center space-x-2">
                        <Sparkles size={18} className="text-gray-700" />
                        <span className="font-bold text-gray-900">问问REMI</span>
                      </div>
                      <div className="flex items-center space-x-3 text-gray-400">
                        <span className="text-[10px] bg-gray-100 px-2 py-0.5 rounded font-medium">内容由AI生成</span>
                        <PanelRightClose size={18} className="cursor-pointer hover:text-gray-700" onClick={() => setIsRightPanelOpen(false)} />
                      </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-6">
                      {chatMessages.length === 0 ? (
                        <div className="flex items-center justify-center h-full text-sm text-gray-400">
                          向 Remi 提问以获取灵感
                        </div>
                      ) : chatMessages.map((msg, index) => {
                        const showContext = msg.context && (index === 0 || msg.context !== chatMessages[index - 1].context);
                        return (
                          <React.Fragment key={msg.id}>
                            {showContext && (
                              <div className="flex justify-center mb-5 w-full">
                                <div className="rounded-full p-[1.5px] bg-gradient-to-r from-[#8b5cf6] to-[#d8b4fe] max-w-[90%]" style={{boxShadow:'0 0 12px rgba(168,130,255,0.4)'}}>
                                  <div className="bg-[#fcfaff] rounded-full px-5 py-1.5 flex items-center justify-center text-[11px] font-bold text-[#8b5cf6]">
                                    <Link size={12} className="mr-1.5 flex-shrink-0" />
                                    <span className="truncate">{msg.context}</span>
                                  </div>
                                </div>
                              </div>
                            )}
                            <div className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                              <div className={`max-w-[85%] rounded-2xl p-3.5 text-[13px] leading-relaxed ${
                                msg.sender === 'user' ? 'bg-white border border-gray-200 shadow-sm text-gray-800 rounded-tr-sm' : 'bg-transparent text-gray-800'
                              }`}>
                                {msg.text.split('\n').map((line, i) => (
                                  <React.Fragment key={i}>
                                    {line.startsWith('**') ? <strong className="block mt-2 mb-1">{line.replace(/\*\*/g, '')}</strong> : line}
                                    {i < msg.text.split('\n').length - 1 && <br />}
                                  </React.Fragment>
                                ))}
                              </div>
                            </div>
                          </React.Fragment>
                        );
                      })}
                    </div>

                    <div className="p-4 bg-white border-t border-gray-50">
                      <div className="bg-white border border-gray-200 rounded-xl p-2 shadow-sm focus-within:border-purple-300 transition-colors">
                        <input
                          type="text"
                          value={inputValue}
                          onChange={(e) => setInputValue(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && handleSendMessage(inputValue)}
                          placeholder="询问任何问题"
                          className="w-full bg-transparent outline-none text-[13px] p-2 mb-2"
                        />
                        <div className="flex justify-between items-center px-1 pb-1">
                          <button className="flex items-center px-2 py-1 bg-purple-50 text-purple-600 rounded text-[11px] font-medium">
                            <Link size={12} className="mr-1" />插入文件
                          </button>
                          <button onClick={() => handleSendMessage(inputValue)} className={`w-7 h-7 rounded-full flex items-center justify-center transition-colors ${inputValue.trim() ? 'bg-[#a882ff] text-white' : 'bg-purple-50 text-purple-300'}`}>
                            <ArrowUp size={14} />
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </div>
        );
      };

      /* ── 路由渲染 ── */
      return (
        <div className="font-sans text-gray-900 h-screen w-full flex overflow-hidden">
          {(currentRoute === 'topics' || currentRoute === 'inspiration') && (
            <>
              <GlobalSidebar />
              {currentRoute === 'topics' ? <TopicsView /> : <InspirationView />}
            </>
          )}
          {currentRoute === 'topic-detail' && (
            <TopicDetailView />
          )}
        </div>
      );
    }

    /* ── 挂载 ── */
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
